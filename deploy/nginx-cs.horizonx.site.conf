# Nginx site config for the HorizonX Agentic OS at cs.horizonx.site
# Install: copy to /etc/nginx/sites-available/cs.horizonx.site,
#          ln -s into sites-enabled, nginx -t, systemctl reload nginx
#
# Note: cs.horizonx.site is proxied by Cloudflare. Either:
#  - use a Cloudflare Origin Certificate here (recommended, set SSL mode "Full (strict)"), or
#  - use certbot/Let's Encrypt with Cloudflare in "Full" mode.

server {
    listen 80;
    server_name cs.horizonx.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cs.horizonx.site;

    # Adjust paths to your certificate installation:
    ssl_certificate     /etc/ssl/cloudflare/cs.horizonx.site.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cs.horizonx.site.key;

    # The Node backend serves both the API and the built frontend.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check passthrough (no auth, no cookies needed)
    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        proxy_set_header Host $host;
    }
}
